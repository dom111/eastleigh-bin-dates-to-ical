services:
  nginx:
    image: nginx:1-alpine
    container_name: ${APP_NAME}-php-nginx
    ports:
      # Only reachable from the host; put the host's reverse proxy in front of it.
      - 127.0.0.1:8080:80
    links:
      - app
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ./docker/php
      args:
        APP_UID: ${APP_UID}
    container_name: ${APP_NAME}-php-app
    volumes:
      - ./:/var/www
    security_opt:
      - no-new-privileges:true
