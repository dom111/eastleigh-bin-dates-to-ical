# Each feed request downloads a PDF from the council, so cap how often one client can hit it.
limit_req_zone $binary_remote_addr zone=feed:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/public;
    server_tokens off;

    # The app only serves calendar feeds; everything else (including the Symfony
    # profiler at /_profiler, /_wdt and /_error) is never routed to PHP.
    location / {
        return 404;
    }

    location ~ "^/\d{12}\.ics$" {
        limit_req zone=feed burst=10 nodelay;
        limit_req_status 429;

        fastcgi_pass app:9000;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}
